name: Deploy to Staging

on:
  pull_request:
    branches:
      - main
    types:
      - closed
      
jobs:
    deploy:
        if: github.event.pull_request.merged == true
        runs-on: ubuntu-latest
        environment: Staging
        steps:
          - name: Comprobar secretos de despliegue
            env:
              TOKEN_DEPLOY: ${{ secrets.TOKEN_DEPLOY }}
              URL_DEPLOY: ${{ secrets.URL_DEPLOY }}
            run: |
              missing=0

              if [ -n "$TOKEN_DEPLOY" ]; then
                echo "TOKEN_DEPLOY detectado: tiene valor"
              else
                echo "::error::TOKEN_DEPLOY no tiene valor"
                missing=1
              fi

              if [ -n "$URL_DEPLOY" ]; then
                echo "URL_DEPLOY detectado: tiene valor"
              else
                echo "::error::URL_DEPLOY no tiene valor"
                missing=1
              fi

              exit $missing