name: TDD Check

on:
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen del API (con caché)
        uses: docker/bake-action@v6
        with:
          files: docker-compose.yml
          targets: api
          load: true
          set: |
            api.cache-from=type=gha,scope=api
            api.cache-to=type=gha,scope=api,mode=max

      - name: Levantar Docker
        run: |
          docker compose up -d db api
          until docker compose exec -T db mysqladmin ping -h 127.0.0.1 -u root -proot_password --silent; do
            sleep 2
          done
          docker compose exec -T api alembic upgrade head

      - name: Ejecutar TDD
        run: docker compose exec -T api pytest

      - name: Devolver OK
        run: echo "${{ vars.STATUS_OK_MESSAGE }}"

      - name: Logs de Docker (si falla)
        if: failure()
        run: |
          docker compose logs
          echo "${{ vars.STATUS_FAIL_MESSAGE }}"